<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>事件预览 · EasyNVR</title><script src="/theme.js"></script><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/replay.css"><script src="/artplayer.js" defer></script><script src="/replay.js" defer></script><script src="/app.js" defer></script></head>
<body><aside class="rail"><a class="brand" href="/" aria-label="事件预览首页"><svg viewBox="0 0 32 32" width="28" height="28" fill="none" aria-hidden="true"><rect x="3" y="7" width="20" height="18" rx="5" stroke="currentColor" stroke-width="2"/><path d="m23 13 6-3v12l-6-3M9 16h8M13 12v8" stroke="currentColor" stroke-width="2"/></svg><span>EasyNVR <small>事件预览</small></span></a><nav><a href="/live">直播</a><a class="active" href="/">事件预览</a><a id="replayNav" href="#replay" aria-controls="replay">录像回放</a><a href="/daily">每日分析</a></nav><div class="rail-console" aria-label="录像控制台">
  <section class="console-panel adaptive-panel" aria-label="智能录像">
    <div class="adaptive-heading"><label for="adaptiveToggle">智能录像</label><input id="adaptiveToggle" type="checkbox" role="switch" aria-describedby="adaptiveHint adaptiveState" disabled></div>
    <span id="adaptiveHint" class="console-sr-only">静止约 2 帧/秒，活动保留原帧率。关闭后停止优化新录像。</span>
    <div class="adaptive-metric"><strong id="adaptiveCount">—</strong><span>段已优化</span></div>
    <div class="console-meta"><span id="adaptiveState" role="status">读取中</span><span id="adaptiveSaved">—</span></div>
  </section>
  <section id="storagePanel" class="console-panel storage-panel" aria-label="录像磁盘空间">
    <div class="console-heading"><strong id="diskLabel">录像硬盘</strong><strong id="diskSummary">读取中</strong></div>
    <meter id="diskMeter" min="0" max="1" value="0" aria-label="硬盘已用空间"></meter>
    <div class="console-meta"><span id="diskDetail">—</span><span id="diskPercent">—</span></div>
  </section>
  <section class="console-panel global-cleanup-panel" aria-label="数据管理">
    <div class="global-cleanup-heading"><strong>数据管理</strong></div>
    <button id="cleanupAll" class="global-cleanup destructive" type="button" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3m3 0-1 13H7L6 7m4 4v5m4-5v5"/></svg><span>全部清空<small>录像、事件与图片</small></span></button>
    <button id="cleanupAllVideos" class="global-cleanup" type="button" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="14" height="12" rx="2"/><path d="m17 10 4-3v10l-4-3M8 9l4 3-4 3Z"/></svg><span>清空全部录像<small>保留事件与快照</small></span></button>
    <button id="clearPreviewCache" class="global-cleanup" type="button" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 17 9-9 4 4-9 9H3v-4Zm9-9 4-4 4 4-4 4m-9 1 4 4"/></svg><span>清理缓存<small>预览图与临时视频</small></span></button>
  </section>
</div></aside>

<main><div class="title-row"><div><h1>事件预览</h1><p id="counts">正在读取 EasyNVR 事件</p></div><div class="page-actions"><div class="layout-switch" id="layoutSwitch" role="group" aria-label="事件布局"><button type="button" data-layout="1">1 路</button><button type="button" data-layout="4">4 路</button><button type="button" data-layout="6">6 路</button></div><button class="theme-toggle" type="button" data-theme-toggle aria-label="切换到深色主题">
  <span class="theme-to-dark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.9 13.4A9 9 0 0 1 10.6 3.1a9 9 0 1 0 10.3 10.3Z"/></svg>深色</span>
  <span class="theme-to-light"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4m0-14.2-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>浅色</span>
</button><button id="refresh" type="button">刷新事件</button></div></div><div id="sourceError" class="notice error" role="status" hidden></div>
<p id="storageNotice" class="storage-notice" role="status" hidden></p>
<div id="replayMount"></div><section id="eventDock"><div id="replayDock" hidden><strong>事件列表</strong><span id="replayDockCount"></span><div id="replayDockShots"></div><button id="expandEventDock" type="button">展开事件</button></div><div id="eventList" class="event-list" aria-label="摄像头事件录像"><p class="empty">正在加载事件…</p></div>
</section></main><section id="hoverPreview" class="hover-preview" aria-label="事件录像悬停预览" hidden><div class="hover-head"><strong id="hoverTitle"></strong><time id="hoverTime"></time></div><video id="hoverVideo" muted loop playsinline preload="metadata"></video><p id="hoverMessage"></p></section><dialog id="playerDialog" aria-labelledby="playerTitle"><div class="player-head"><div><h2 id="playerTitle">事件录像</h2><p id="playerTime"></p></div><div class="player-actions"><a id="downloadVideo" class="download-link" download hidden title="下载事件录像" aria-label="下载事件录像"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M5 16v4h14v-4"/></svg></a><button id="closePlayer" type="button">关闭</button></div></div><video id="eventVideo" controls playsinline preload="metadata"></video><img id="videoFallback" alt="事件图片" hidden><p id="playerMessage" class="player-message" role="status"></p></dialog><dialog id="cleanupDialog" class="cleanup-dialog" aria-labelledby="cleanupTitle"><div class="cleanup-body"><h2 id="cleanupTitle">清空本路录像及事件</h2><p id="cleanupScope" class="cleanup-scope"></p><p id="cleanupTargets" class="cleanup-targets"></p><p id="cleanupMessage" role="status"></p><label for="cleanupName">输入摄像头名称确认：<strong id="cleanupExpected"></strong></label><input id="cleanupName" autocomplete="off" spellcheck="false"><div class="cleanup-actions"><button id="cancelCleanup" type="button">取消</button><button id="confirmCleanup" class="danger-button" type="button" disabled>确认清空</button></div></div></dialog><dialog id="cameraPicker" class="picker-dialog" aria-labelledby="pickerTitle"><div class="cleanup-body"><h2 id="pickerTitle">添加摄像头</h2><div id="pickerOptions" class="picker-options"></div><div class="cleanup-actions"><button id="pickerCancel" type="button">取消</button></div></div></dialog></body></html>
